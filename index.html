<style>
/* Layout: RTL storefront (header, hero, grid, footer) plus an admin shell with a dark side rail. Warm paper + espresso ink + brass accent. */
:root{
  --bg:#F1E6D8; --surface:#FAF4EA; --band:#EADBC8; --line:#D9C3A5; --ink:#3A281C; --muted:#6B5A4A;
  --gold:#B08D57; --btn:#3A281C; --btn-fg:#F1E6D8; --field:#F1E6D8;
  --side:#3A281C; --side-fg:#EADBC8; --side-on:#5A4130;
  --ok:#2F6B3F; --ok-bg:#DCEBD8; --warn:#7A5410; --warn-bg:#F3E3BC; --bad:#9B2F25; --bad-bg:#F4D9D3;
  --font:'Tajawal',system-ui,sans-serif; --display:'Reem Kufi','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B130E; --surface:#261A13; --band:#2E2018; --line:#4A3626; --ink:#F1E6D8; --muted:#BDA98F;
  --gold:#C9A56A; --btn:#F1E6D8; --btn-fg:#2A1B12; --field:#1B130E;
  --side:#120B07; --side-fg:#EADBC8; --side-on:#3A2A1E;
  --ok:#8FD19E; --ok-bg:#1F3326; --warn:#E8C26F; --warn-bg:#3B2D10; --bad:#F0A39A; --bad-bg:#3E1D19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B130E; --surface:#261A13; --band:#2E2018; --line:#4A3626; --ink:#F1E6D8; --muted:#BDA98F;
  --gold:#C9A56A; --btn:#F1E6D8; --btn-fg:#2A1B12; --field:#1B130E;
  --side:#120B07; --side-fg:#EADBC8; --side-on:#3A2A1E;
  --ok:#8FD19E; --ok-bg:#1F3326; --warn:#E8C26F; --warn-bg:#3B2D10; --bad:#F0A39A; --bad-bg:#3E1D19; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;min-height:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.3}
.in{width:100%;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
/* header */
.hd{background:var(--band);border-bottom:1px solid var(--line)}
.hd .in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px;flex-wrap:wrap;padding-block:10px}
.logo{width:60px;height:60px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px;text-decoration:none;background:var(--bg);text-align:center;line-height:1.1}
.nav{display:flex;gap:28px;font-size:18px}
.nav a{text-decoration:none;padding:8px 2px;border-bottom:2px solid transparent;min-height:44px;display:flex;align-items:center}
.nav a.on{border-color:var(--gold)}
.acts{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1.5px solid var(--ink);border-radius:999px;padding:0 16px;min-height:44px;font-weight:500;background:transparent;cursor:pointer}
.cartb{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.cartb b{position:absolute;top:0;left:0;min-width:20px;height:20px;border-radius:10px;background:var(--btn);color:var(--btn-fg);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;border:2px solid var(--gold);background:var(--btn);color:var(--btn-fg);font-weight:500;font-size:18px;text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:15px;padding:0 20px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1.5px solid var(--ink);border-radius:10px;background:transparent;font-weight:500;cursor:pointer;font-size:15px;text-decoration:none}
.ghost.danger{border-color:var(--bad);color:var(--bad)}
.ico{width:44px;height:44px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
label.l{font-size:15px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f input,.f select,.f textarea,.fi{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 14px;font-size:16px;color:var(--ink)}
.f textarea{padding:10px 14px;resize:vertical}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1 1 220px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--field)}
.qty button{width:44px;height:44px;border:0;background:transparent;font-size:22px;cursor:pointer}
.qty span{min-width:28px;text-align:center;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.muted{color:var(--muted)}
/* hero */
.hero{background:var(--band)}
.hero .in{display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding-block:56px}
.hero-t{flex:1 1 380px;display:flex;flex-direction:column;gap:18px;align-items:flex-start;min-width:0}
.kick{border:1px solid var(--gold);border-radius:999px;padding:2px 14px;font-size:14px}
.hero h1{font-size:clamp(44px,8vw,84px)}
.hero .sub{font-family:var(--display);font-size:clamp(22px,3vw,30px);margin:0}
.hero .desc{margin:0;max-width:52ch;color:var(--muted);font-size:18px}
.hero-img{flex:1 1 300px;aspect-ratio:4/5;max-width:440px;margin-inline:auto;border-radius:200px 200px 24px 24px;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover}
.sec{padding-block:48px;display:flex;flex-direction:column;gap:24px}
.sec h2{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.pc{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.pc .im{aspect-ratio:1;background:var(--line);display:flex;align-items:center;justify-content:center}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .tx{padding:14px;display:flex;flex-direction:column;gap:2px;text-align:center}
.pc strong{font-size:18px}
.tag{position:absolute;top:10px;right:10px;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:0 10px;font-size:13px}
/* shop */
.banner{background:var(--band);border-bottom:1px solid var(--line)}
.banner .in{display:flex;gap:32px;flex-wrap:wrap;align-items:center;padding-block:40px}
.banner .bt{flex:1 1 320px}.banner h1{font-size:clamp(32px,5vw,48px)}
.banner img{width:min(320px,100%);aspect-ratio:16/9;object-fit:cover;border-radius:14px}
.shop{display:flex;gap:32px;flex-wrap:wrap;padding-block:32px;align-items:flex-start}
.filter{flex:0 0 230px;display:flex;flex-direction:column;gap:8px}
.filter button{text-align:right;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer}
.filter button.on{background:var(--btn);color:var(--btn-fg)}
.shop .list{flex:1 1 500px;min-width:0;display:flex;flex-direction:column;gap:20px}
/* product */
.crumb{font-size:15px;color:var(--muted);padding-top:28px}
.prod{display:flex;flex-wrap:wrap;gap:48px;padding-block:24px 8px;align-items:flex-start}
.heart{position:absolute;top:16px;left:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.heart.on{color:var(--bad)}.heart.on svg{fill:currentColor}
.bn{display:none}
.prod .pi{position:relative;flex:1 1 340px;aspect-ratio:1;max-width:520px;border-radius:20px;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod .pi img{width:100%;height:100%;object-fit:cover}
.prod .pd{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:18px}
.prod h1{font-size:clamp(32px,5vw,44px)}
.sizes{display:flex;flex-wrap:wrap;gap:12px}
.sz{min-width:112px;min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sz.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.sz b{font-size:18px}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;font-size:24px;font-weight:700}
/* cart / checkout */
.two{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;padding-block:36px 64px}
.two>.main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.two>aside{flex:1 1 340px;max-width:440px}
.line{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;flex-wrap:wrap}
.line .th{width:84px;height:84px;border-radius:10px;background:var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.line .th img{width:100%;height:100%;object-fit:cover}
.line .nm{flex:1 1 150px;min-width:0}
.sumrow{display:flex;justify-content:space-between;gap:12px}
.grand{border-top:1px solid var(--line);padding-top:16px;font-size:22px;font-weight:700}
.chip{display:flex;justify-content:space-between;align-items:center;background:var(--band);border-radius:10px;padding:4px 4px 4px 14px;font-size:15px}
.err{color:var(--bad);font-size:15px;margin:0}
.radio{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.radio.on{border:2px solid var(--ink)}
.radio input{width:20px;height:20px}
.narrow{max-width:760px;margin:0 auto;padding-block:44px 64px;display:flex;flex-direction:column;gap:24px}
.stars{display:flex;gap:2px}
.stars button{width:48px;height:48px;border:0;background:transparent;font-size:38px;line-height:1;cursor:pointer;color:var(--line)}
.stars button.on{color:var(--gold)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:16px;min-height:64px}
.steps .dot{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.steps .done .dot{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.steps .now .dot{background:var(--gold);color:#2A1B12;border-color:var(--ink)}
.steps .done strong,.steps .now strong{color:var(--ink)}
.steps strong{color:var(--muted);font-size:18px;display:block}
.ordno{font-family:var(--display);font-size:30px;border:1.5px dashed var(--gold);border-radius:12px;padding:4px 24px;background:var(--surface)}
.empty{text-align:center;padding:64px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--muted)}
/* footer */
.ft{background:var(--side);color:var(--side-fg);margin-top:auto}
.ft .in{padding-block:36px;display:flex;flex-wrap:wrap;gap:24px 48px;justify-content:space-between}
.ft h3{font-size:20px;margin-bottom:8px}
.ft p{margin:0}.ft .cp{flex-basis:100%;border-top:1px solid var(--side-on);padding-top:16px;font-size:14px}
#app{min-height:100vh;display:flex;flex-direction:column}
.page{flex:1}
/* admin */
.adm{display:flex;flex:1;min-height:100vh}
.side{flex:0 0 240px;background:var(--side);color:var(--side-fg);padding:24px 16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.side .br{font-family:var(--display);font-size:24px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side a{text-decoration:none;min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:10px}
.side a:hover{background:var(--side-on)}
.side a.on{background:var(--side-on);color:#FAF4EA}
.am{flex:1;min-width:0;padding:32px;padding-left:max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px}
.am h1{font-size:34px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
.col{background:var(--band);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col h2{font-size:18px;display:flex;justify-content:space-between}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.badge{display:inline-block;border-radius:999px;padding:0 12px;font-size:14px;background:var(--band)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tr{display:grid;grid-template-columns:64px 1.4fr 1.2fr 1.6fr 100px 190px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-width:760px}
.tr.c4{grid-template-columns:1.4fr 1fr 1fr 1fr 190px}
.tr:last-child{border-bottom:0}.tr.h{font-size:14px;color:var(--muted);background:var(--band)}
.tr .t{width:48px;height:48px;border-radius:8px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.tr .t img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{display:inline-flex;align-items:center;gap:2px;background:var(--band);border-radius:999px;padding:0 4px 0 14px;min-height:40px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column}
.stat strong{font-family:var(--display);font-size:32px}
.bar{height:10px;border-radius:5px;background:var(--band);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.bl{display:flex;flex-direction:column;gap:6px}.bl>div:first-child{display:flex;justify-content:space-between}
.imgbox{width:160px;aspect-ratio:1;border-radius:12px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center}
.imgbox img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.wa{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:15;display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;background:var(--btn);color:var(--btn-fg);border:2px solid var(--gold);text-decoration:none;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:12px 24px;border-radius:999px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
/* home hero, shop banner, filters and product cards (match the design) */
.logo{width:72px;height:72px;padding:0;overflow:hidden;border:2px solid var(--gold);background:var(--bg)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.srch{background:var(--band);border-bottom:1px solid var(--line)}
.srch form{display:flex;gap:8px;padding-block:12px}.srch .fi{flex:1}
.hero2{background:#E6D3BC center right/cover no-repeat;min-height:clamp(480px,56vw,740px);display:flex;align-items:center;color:#2A1B12}
.hero2 .in{display:flex}
.ht{width:min(560px,46vw);margin-inline-start:auto;display:flex;flex-direction:column;gap:14px;text-align:center;padding-block:32px}
.ht h1{font-family:'Aref Ruqaa',var(--display);font-size:clamp(64px,10vw,128px);font-weight:700;line-height:1.15;color:#1B120C}
.ht p{margin:0;color:#4E3C2E;font-size:18px;line-height:1.9}
.orn{display:flex;align-items:center;gap:14px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#8C6B38)}.orn i:last-child{transform:scaleX(-1)}
.kk{font-size:22px}.sb{font-size:clamp(18px,2.2vw,26px)}
.cta{align-self:center;display:inline-flex;align-items:center;justify-content:center;gap:28px;min-height:56px;padding:0 40px;border-radius:999px;background:#1D1511;color:#F5EBDD;border:0;box-shadow:0 0 0 3px #C9A56A;text-decoration:none;font-size:18px;font-weight:500;cursor:pointer;margin-top:8px}
.cta.sm{align-self:stretch;min-height:48px;font-size:16px;margin:4px 3px;gap:12px}
.bnr{background:#D9C3A5 center right/cover no-repeat;min-height:clamp(170px,15vw,230px);display:flex;align-items:center;color:#2A1B12;border-bottom:1px solid var(--line)}
.bnr .in{display:flex}
.bt2{width:min(560px,46vw);margin-inline-start:auto;text-align:center;display:flex;flex-direction:column;gap:6px;padding-block:20px}
.bt2 h1{font-family:'Aref Ruqaa',var(--display);font-size:clamp(40px,6vw,72px);line-height:1.2;color:#1B120C}
.bt2 p{margin:0;font-size:17px}
.shop2{display:flex;gap:24px;align-items:flex-start;padding-block:28px 56px;flex-wrap:wrap}
.shop2 .lc{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.ft .dev{flex-basis:100%;margin:0;font-size:14px;opacity:.75}.ft .dev b{font-weight:700}
.stars{color:var(--gold);letter-spacing:1px}.stars i{color:var(--line);font-style:normal}.rt{font-size:14px;color:var(--muted)}
.rvs{display:flex;flex-direction:column;gap:12px}.rvs .rv{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}.rvs .rv p{margin:6px 0 0}
.fbtn{display:none;align-items:center;gap:8px;margin-bottom:12px}
.flt{flex:0 0 270px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.flt h2{font-size:18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.flt h3{font-size:16px;margin-bottom:6px}
.fg{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;color:var(--muted)}
.opt input{width:18px;height:18px;accent-color:var(--gold)}
.lnk{background:none;border:0;min-height:40px;cursor:pointer;text-decoration:underline;color:var(--muted)}
.tb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tb select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;min-width:220px;max-width:100%}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='i-lg-pw'){e.preventDefault();ACT.login()}});
/* ---------- boot ---------- */
function load(){S.gov=lsGet('sa_gov')||'عمّان';S.lastOrder=lsGet('sa_last')||'';try{S.fav=JSON.parse(lsGet('sa_fav')||'[]')}catch(e){S.fav=[]}if(!Array.isArray(S.fav))S.fav=[];try{var cu=JSON.parse(lsGet('sa_cust')||'{}');if(cu.name)S.co.name=cu.name;if(cu.phone)S.co.phone=cu.phone;if(cu.addr)S.co.addr=cu.addr}catch(e){}try{S.cart=JSON.parse(lsGet('sa_cart')||'[]')}catch(e){S.cart=[]}if(!Array.isArray(S.cart))S.cart=[]}
async function boot(){
 load();render();
 try{if(!window.supabase)throw 1;sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});db=mkdb();var ss=await sb.auth.getSession();isAdmin=ss.data&&ss.data.session?await adminCheck():false}catch(e){}
 if(!db){D.ready=true;render();toast('تعذر الاتصال بقاعدة البيانات');return}
 var err=function(){D.ready=true;schedule()};
 db.collection('perfumes').onSnapshot(function(s){D.perfumes=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});D.ready=true;pruneCart();schedule()},err);
 db.doc('cats/main').onSnapshot(function(d){D.cats=d.exists?(d.data().list||[]):[];schedule()},err);
 db.doc('delivery/main').onSnapshot(function(d){D.delivery=d.exists?d.data():null;schedule()},err);
 db.doc('site/main').onSnapshot(function(d){D.site=d.exists?d.data():{};schedule()},err);
 loadSum();setInterval(loadSum,300000);
 if(isAdmin)adminOn();
}
async function loadTg(){try{var r=await sb.from('config').select('key').in('key',['tg_token','tg_chat']);S.tgOn=!!(r.data&&r.data.length===2);schedule()}catch(e){}}
function adminOn(){startOrders();loadTg();db.collection('codes').onSnapshot(function(s){D.codes=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});schedule()},function(){})}
boot();
})();
</script>
</body>
</html>
